name: Article proposal

on:
  issues:
    types: [opened]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  prepare:
    if: contains(github.event.issue.title, '[artigo]') || contains(github.event.issue.body, '## Destino')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Select proposal branch
        id: branch
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          branch="article/issue-${ISSUE_NUMBER}"
          if git fetch origin "refs/heads/${branch}:refs/remotes/origin/${branch}"; then
            git switch -c "${branch}" --track "origin/${branch}"
            echo "existing=true" >> "$GITHUB_OUTPUT"
          else
            git switch -c "${branch}"
            echo "existing=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate issue and create files
        id: article
        if: steps.branch.outputs.existing != 'true'
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: node .github/scripts/process-article-issue.mjs

      - name: Install dependencies
        if: steps.branch.outputs.existing != 'true'
        run: npm ci

      - name: Validate Astro build
        if: steps.branch.outputs.existing != 'true'
        run: npm run build

      - name: Commit and push proposal
        if: steps.branch.outputs.existing != 'true'
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content
          git commit -m "content: add article proposal from issue #${ISSUE_NUMBER}"
          git push --set-upstream origin "article/issue-${ISSUE_NUMBER}"

      - name: Open pull request
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: >-
          gh pr create --base main --head "article/issue-${ISSUE_NUMBER}"
          --title "${ISSUE_TITLE}"
          --body "Closes #${ISSUE_NUMBER}. Generated from the article proposal issue."
